<ion-content [fullscreen]="true" class="login-bg">
  <div class="login-container">
    <div class="logo-section">
      <div class="glow-circle">
        <ion-icon name="fitness-outline" class="logo-icon"></ion-icon>
      </div>
      <h1 class="brand-title">FIT<span class="neon">TRACK</span> AI</h1>
      <p class="brand-subtitle">Tu entrenador personal de bolsillo</p>
    </div>

    <div class="glass-card login-form">
      <h2 *ngIf="!isRegistering">Iniciar Sesión</h2>
      <h2 *ngIf="isRegistering">Crear Cuenta</h2>
      
      <div class="input-group" *ngIf="isRegistering">
        <ion-icon name="person-outline"></ion-icon>
        <input type="text" placeholder="Nombre Completo" [(ngModel)]="fullName" />
      </div>

      <div class="input-group">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" placeholder="Correo Electrónico" [(ngModel)]="email" />
      </div>

      <div class="input-group">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" placeholder="Contraseña" [(ngModel)]="password" />
      </div>

      <button class="neon-btn login-btn" (click)="login()" *ngIf="!isRegistering">INGRESAR</button>
      <button class="neon-btn register-btn" (click)="register()" *ngIf="isRegistering">REGISTRARSE</button>
      
      <p class="register-link" *ngIf="!isRegistering">¿No tienes cuenta? <span class="neon" (click)="toggleRegister()">Regístrate</span></p>
      <p class="register-link" *ngIf="isRegistering">¿Ya tienes cuenta? <span class="neon" (click)="toggleRegister()">Inicia Sesión</span></p>
    </div>
  </div>
</ion-content>
